name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Build and test the Rust search tool
        working-directory: tools/codesearch
        run: |
          cargo test
          cargo build --release

      - name: Run the agent tests (scripted model, no API key needed)
        run: python -m pytest -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: npm install

      - name: Type-check and build the dashboard
        run: npm run build
