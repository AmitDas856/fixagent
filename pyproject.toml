[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixagent"
version = "0.1.0"
description = "AI agent that fixes bugs in Python, C++ and Rust repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit Das" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fixagent = "fixagent.cli:main"

[tool.setuptools]
packages = ["fixagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
